<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inbodybuilder</title>
<meta name="description" content="친구들과 인바디 기반 2주 목표를 세우고 퀘스트로 결승선까지 달리는 운동 챌린지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: an athletics stadium. The tartan track with one lane per friend is the hero;
   quests read like a scorecard and the InBody input mirrors the muscle-fat sheet. */
:root{
  --paper:#EEF2EC; --surface:#FBFCFA; --ink:#15211B; --muted:#56635B; --line:#D2D9D0;
  --track:#B5452F; --track-deep:#93361F; --chalk:#FFFFFF; --chalk-dim:rgba(255,255,255,.55);
  --field:#2B6A4A; --field-ink:#FFFFFF; --field-soft:#DCEADF; --band:#E3E8E1;
  --warn:#9A5A12; --warn-soft:#F6EBDB; --chk-a:#FFFFFF; --chk-b:#15211B;
  --f-num:"Archivo", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-head:"Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --f-body:"IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --r:10px;
  --bronze:#A8662C; --silver:#7F8A93; --gold:#C38E12; --special:#B5452F;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1512; --surface:#161E1A; --ink:#E5ECE7; --muted:#93A198; --line:#29342E;
  --track:#A23E2A; --track-deep:#7F2F1F; --chalk:#FFF7F2; --chalk-dim:rgba(255,247,242,.5);
  --field:#5DB386; --field-ink:#0C1611; --field-soft:#1B3125; --band:#202A25;
  --warn:#E2A85A; --warn-soft:#2E2414; --chk-a:#F4F4F0; --chk-b:#0F1512; color-scheme:dark;
  --bronze:#B87638; --silver:#8A969F; --gold:#C9971E; --special:#B04A33;
}}
:root[data-theme="dark"]{
  --paper:#0F1512; --surface:#161E1A; --ink:#E5ECE7; --muted:#93A198; --line:#29342E;
  --track:#A23E2A; --track-deep:#7F2F1F; --chalk:#FFF7F2; --chalk-dim:rgba(255,247,242,.5);
  --field:#5DB386; --field-ink:#0C1611; --field-soft:#1B3125; --band:#202A25;
  --warn:#E2A85A; --warn-soft:#2E2414; --chk-a:#F4F4F0; --chk-b:#0F1512; color-scheme:dark;
  --bronze:#B87638; --silver:#8A969F; --gold:#C9971E; --special:#B04A33;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1{font-family:var(--f-head);font-size:clamp(26px,5vw,38px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-head);font-size:22px;line-height:1.25}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--field);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.logo{text-decoration:none;font-family:var(--f-num);font-weight:900;font-style:italic;font-stretch:118%;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline}
.logo-a{color:var(--track)}
.logo-b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.tabs a:hover:not([aria-current="page"]){color:var(--ink)}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tabs a{flex:1;text-align:center;padding:7px 4px}}

.notice{max-width:1080px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notice p{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:28px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--surface)}
.btn.go{background:var(--field);color:var(--field-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* race */
.race-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.race-head > div{display:grid;gap:6px;min-width:0}
.me-stat{display:flex;gap:20px;align-items:flex-end}
.stat{display:grid;gap:0}
.stat b{font-family:var(--f-num);font-weight:800;font-stretch:112%;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stadium{background:var(--track-deep);border-radius:14px;padding:10px 0 14px;overflow:hidden}
.scale,.lane{--start:46px;--end:30px;--av:34px;position:relative}
.scale{height:22px;color:var(--chalk-dim);font-size:11px;font-family:var(--f-num);font-weight:600}
.scale span{position:absolute;top:2px;transform:translateX(-50%);left:calc(var(--start) + (100% - var(--start) - var(--end) - var(--av)) * var(--t) + var(--av) / 2)}
.scale .fin{left:auto;right:0;transform:none;width:var(--end);text-align:center;color:var(--chalk)}
.lane{height:62px;background:
  repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.035) 3px 4px),
  var(--track);border-top:2px solid var(--chalk)}
.lane:last-of-type{border-bottom:2px solid var(--chalk)}
.lane.me{background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.035) 3px 4px),linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),var(--track)}
.lane-no{position:absolute;left:0;top:0;bottom:0;width:var(--start);display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-stretch:80%;font-size:30px;color:var(--chalk);border-right:2px solid var(--chalk)}
.tick{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--chalk-dim);left:calc(var(--start) + (100% - var(--start) - var(--end) - var(--av)) * var(--t) + var(--av) / 2)}
.finish{position:absolute;right:0;top:0;bottom:0;width:var(--end);background:conic-gradient(var(--chk-a) 25%,var(--chk-b) 0 50%,var(--chk-a) 0 75%,var(--chk-b) 0) 0 0/10px 10px}
.runner{position:absolute;top:50%;left:calc(var(--start) + (100% - var(--start) - var(--end) - var(--av)) * var(--p));transform:translateY(-50%);display:flex;align-items:center;gap:6px;transition:left .9s cubic-bezier(.2,.8,.2,1);z-index:1;max-width:60%}
.runner.flip{flex-direction:row-reverse;transform:translate(calc(-100% + var(--av)),-50%)}
.av{width:var(--av,34px);height:var(--av,34px);border-radius:50%;flex:none;border:2.5px solid var(--chalk);background:var(--surface);object-fit:cover}
.tag{background:rgba(0,0,0,.32);color:var(--chalk);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag small{font-family:var(--f-num);font-weight:600;opacity:.85;margin-left:4px}
.lane-empty{position:absolute;left:calc(var(--start) + 14px);right:calc(var(--end) + 14px);top:50%;transform:translateY(-50%);color:var(--chalk);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){.runner{transition:none}}

.board{width:100%;border-collapse:collapse;font-size:14px}
.board-wrap{overflow-x:auto}
.board th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.board tr.me td{background:var(--field-soft)}
.who{display:flex;align-items:center;gap:10px}
.who .av{--av:28px;border-color:var(--line)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--band);color:var(--ink)}
.chip.cut{background:var(--warn-soft);color:var(--warn)}
.chip.bulk,.chip.ok{background:var(--field-soft);color:var(--field)}
.chip.fin{background:var(--ink);color:var(--surface)}
.meter{display:flex;align-items:center;gap:8px}
.meter i{display:block;width:90px;height:6px;border-radius:3px;background:var(--band);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--track)}
.arrow{color:var(--muted)}

/* quests */
.q-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:end}
@media (max-width:640px){.q-top{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .wk{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px 7px;display:grid;gap:3px;justify-items:center;cursor:pointer;min-width:0}
.day b{font-family:var(--f-num);font-weight:800;font-size:15px;line-height:1.1}
.day span{font-size:11px;color:var(--muted)}
.day i{display:block;width:80%;height:4px;border-radius:2px;background:var(--band);overflow:hidden}
.day i em{display:block;height:100%;background:var(--field)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today b{color:var(--track)}
.day:disabled{opacity:.4;cursor:default}
.qlist{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qt{display:grid;gap:1px;min-width:0}
.qrow .qt b{font-size:16px}
.qrow .qt span{font-size:13px;color:var(--muted)}
.qrow .qk{font-size:12px;font-weight:700;color:var(--muted);width:46px}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:22px;height:22px;stroke:var(--field-ink);stroke-width:3;fill:none;opacity:0}
.check[aria-pressed="true"]{background:var(--field);border-color:var(--field)}
.check[aria-pressed="true"] svg{opacity:1}
.check:disabled{cursor:not-allowed;opacity:.5}
.mini{margin-top:4px}
.goalbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.goalbox{grid-template-columns:1fr}}
.gcell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.gcell span{font-size:12px;color:var(--muted);font-weight:600}
.gcell b{font-family:var(--f-num);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.gcell em{font-style:normal;font-size:13px;font-weight:700;color:var(--field)}
.gcell em.down{color:var(--warn)}
.gcell .res{font-size:13px}

/* setup */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;min-width:0}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:820px){.setup-grid{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:13px;font-weight:600}
.f small{font-size:12px;color:var(--muted)}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.inp:focus-within{border-color:var(--field)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px;font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
.inp input[type=text]{font-family:var(--f-body)}
.inp input:focus,.inp select:focus{outline:none}
.inp input[readonly]{color:var(--muted)}
.inp .u{padding:0 10px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ib{display:grid;gap:14px}
.ibrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.ibrow .lb{font-weight:700;font-size:14px;line-height:1.2}
.ibrow .lb small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ibbar{position:relative;height:40px}
.ibticks{position:absolute;inset:0 0 auto;height:14px;font-family:var(--f-num);font-size:10px;color:var(--muted)}
.ibticks span{position:absolute;transform:translateX(-50%)}
.ibtrack{position:absolute;left:0;right:0;top:17px;height:16px;background:var(--paper);border-radius:2px}
.ibband{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.ibfill{position:absolute;left:0;top:3px;height:10px;background:var(--ink);border-radius:0 2px 2px 0}
.ibval{position:absolute;top:0;font-family:var(--f-num);font-size:12px;font-weight:800;padding-left:6px;line-height:16px;white-space:nowrap}
.ibgoal{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--track);border-radius:2px}
.ibfoot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.ibfoot b{color:var(--ink);font-family:var(--f-num)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle;border-radius:2px}
.ex{font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.goal-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.goal-in{grid-template-columns:1fr}}
.delta{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--field)}
.delta.down{color:var(--warn)}
.why{display:grid;gap:8px;padding:14px 16px;background:var(--field-soft);border-radius:var(--r);font-size:14px}
.why ul{margin:0;padding-left:18px;display:grid;gap:4px}
.why sup{font-family:var(--f-num);font-weight:700;color:var(--field)}
.warns{display:grid;gap:6px}
.warns p{background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:8px}
.q-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.q-in{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lock{padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.refs ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.refs a{color:var(--ink)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:12px;justify-items:start}

/* badges & levels */
.medal{--m:var(--special);position:relative;display:inline-grid;place-items:center;width:var(--ms,64px);height:var(--ms,64px);border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),transparent 42%),var(--m);
  box-shadow:inset 0 0 0 calc(var(--ms,64px) * .06) rgba(255,255,255,.35),inset 0 0 0 calc(var(--ms,64px) * .1) var(--m),inset 0 -4px 8px rgba(0,0,0,.25)}
.medal b{font-family:var(--f-head);font-weight:400;font-size:calc(var(--ms,64px) * .3);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:-.02em;line-height:1}
.medal.bronze{--m:var(--bronze)}.medal.silver{--m:var(--silver)}.medal.gold{--m:var(--gold)}
.medal.locked{--m:var(--band);box-shadow:inset 0 0 0 2px var(--line)}
.medal.locked b{color:var(--muted);text-shadow:none}
.medal.sm{--ms:30px}
.medal.xl{--ms:132px}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 24px;align-items:center;background:var(--ink);color:var(--surface);border-radius:14px;padding:22px}
.lvl .lv{font-family:var(--f-num);font-weight:900;font-style:italic;font-stretch:120%;font-size:56px;line-height:.9}
.lvl .lv small{font-size:20px;font-stretch:100%;margin-right:2px}
.lvl h2{color:var(--surface)}
.xpbar{height:12px;border-radius:6px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:8px}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--track));border-radius:6px;transition:width .8s}
.lvl p{font-size:13px;opacity:.75}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bcard.locked{background:transparent}
.bcard h3{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bcard p{font-size:13px;color:var(--muted)}
.tier{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--band);color:var(--muted)}
.tier.bronze{background:var(--bronze);color:#fff}.tier.silver{background:var(--silver);color:#fff}.tier.gold{background:var(--gold);color:#fff}.tier.special{background:var(--special);color:#fff}
.bprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.bprog i{flex:1;height:5px;border-radius:3px;background:var(--band);overflow:hidden}
.bprog i b{display:block;height:100%;background:var(--field)}
.mrow{display:flex;gap:3px;flex-wrap:wrap}
.lvchip{display:inline-block;font-family:var(--f-num);font-size:12px;font-weight:800;font-style:italic;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);white-space:nowrap}
.crown{width:16px;height:16px;fill:var(--gold);vertical-align:-2px;margin-right:3px}
.cele{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,12,10,.62);padding:16px}
.cele-card{position:relative;background:var(--surface);border-radius:20px;padding:34px 26px 24px;width:min(360px,100%);display:grid;gap:10px;justify-items:center;text-align:center;overflow:hidden;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cele-card::before{content:"";position:absolute;left:50%;top:96px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(var(--gold) 0 6deg,transparent 6deg 20deg);opacity:.16;animation:spin 14s linear infinite;pointer-events:none}
.cele-card > *{position:relative}
.cele-card h2{font-size:26px}
.cele-card .medal{animation:drop .6s cubic-bezier(.2,1.5,.4,1) .1s both}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes drop{from{transform:translateY(-30px) scale(.6) rotate(-20deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cele-card,.cele-card .medal,.cele-card::before{animation:none}}

.auth{max-width:440px;width:100%;margin:8px auto 0}
.acct{background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px}
.acct:hover{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>

<body>

  <a class="logo" href="#race"><span class="logo-a">INBODY</span><span class="logo-b">BUILDER</span></a>
  <nav class="tabs" aria-label="화면">

  <button class="btn go" id="cele-ok" type="button">좋아!</button>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n * 10) / 10;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const round50 = n => Math.round(n / 50) * 50;
const round5 = n => Math.round(n / 5) * 5;
const fmt = n => Number(n).toLocaleString('ko-KR');
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const sgn = n => (n > 0.04 ? '+' : n < -0.04 ? '−' : '±') + Math.abs(r1(n)).toFixed(1);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const today = () => ymd(new Date());
const md = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

const MODE = { cut: '체지방 감량', bulk: '근육 증량', recomp: '리컴포지션' };
const DAILY = ['kcal', 'protein', 'sleep', 'steps'];
const ACT = [
  { v: 1.375, l: '가벼움 · 주 1–3회 운동' },
  { v: 1.55, l: '보통 · 주 3–5회 운동' },
  { v: 1.725, l: '많음 · 주 6–7회 운동' },
];

const REFS = [
  ['Helms ER 외 (2014). 내추럴 보디빌딩 대회 준비를 위한 근거 기반 영양 권고. J Int Soc Sports Nutr.', 'https://pubmed.ncbi.nlm.nih.gov/24864135/', '주당 체중의 0.5–1% 감량이 근손실을 줄이는 속도'],
  ['Helms ER 외 (2014). 감량 중인 저항운동 선수의 단백질 섭취 체계적 고찰. IJSNEM.', 'https://pubmed.ncbi.nlm.nih.gov/24092765/', '감량기 단백질 제지방 kg당 2.3–3.1 g'],
  ['Morton RW 외 (2018). 단백질 보충과 근력·근비대 메타분석. Br J Sports Med.', 'https://pubmed.ncbi.nlm.nih.gov/28698222/', '체중 kg당 약 1.6 g 이상에서 효과가 평탄해짐'],
  ['Jäger R 외 (2017). ISSN 입장문: 단백질과 운동. J Int Soc Sports Nutr.', 'https://pubmed.ncbi.nlm.nih.gov/28642676/', '운동하는 사람 하루 1.4–2.0 g/kg'],
  ['Iraki J 외 (2019). 보디빌더 비시즌 영양 권고. Sports (Basel).', 'https://pubmed.ncbi.nlm.nih.gov/31247944/', '증량기 주당 체중 0.25–0.5% 증가'],
  ['Schoenfeld BJ 외 (2016). 저항운동 빈도와 근비대 메타분석. Sports Med.', 'https://pubmed.ncbi.nlm.nih.gov/27102172/', '근육군마다 주 2회 이상 훈련'],
  ['WHO (2020). 신체활동과 좌식행동 가이드라인.', 'https://www.who.int/publications/i/item/9789240015128', '주 150–300분 중강도 유산소 + 주 2일 이상 근력운동'],
  ['Watson NF 외 (2015). 성인 권장 수면시간 합의문. AASM·SRS, Sleep.', 'https://pubmed.ncbi.nlm.nih.gov/25979105/', '성인은 하루 7시간 이상'],
  ['Paluch AE 외 (2022). 하루 걸음 수와 사망률 메타분석. Lancet Public Health.', 'https://pubmed.ncbi.nlm.nih.gov/35247352/', '60세 미만은 8,000–10,000보까지 위험 감소'],
  ['Hall KD 외 (2011). 체중 변화에 대한 에너지 불균형의 정량화. Lancet.', 'https://pubmed.ncbi.nlm.nih.gov/21872751/', '지방 1 kg ≈ 7,700 kcal는 단기 근사치'],
];
const sup = (...n) => n.map(i => `<sup>[${i}]</sup>`).join('');

/* ---------- state ---------- */
const S = {
  sb: null, session: null, needAuth: false, pending: 0, myId: null,
  players: {}, loaded: false, demo: false, readOnly: false, stale: false,
  view: 'race', selDay: null, draft: null, draftDirty: false,
};

/* ---------- body-composition math ---------- */
function basics(d) {
  const ffm = d.weight - d.bfm;
  const pbf = d.bfm / d.weight * 100;
  const bmr = d.bmr || Math.round(370 + 21.6 * ffm); // Katch–McArdle, the formula on InBody sheets
  const tdee = Math.round(bmr * d.activity);
  return { ffm, pbf, bmr, tdee };
}
function validIb(d) {
  return d && (d.sex === 'm' || d.sex === 'f') && d.height >= 120 && d.height <= 230 &&
    d.weight >= 30 && d.weight <= 250 && d.smm >= 8 && d.smm < d.weight && d.bfm > 0 && d.bfm < d.weight;
}
function suggestGoal(d) {
  const { pbf } = basics(d);
  const hi = d.sex === 'f' ? 28 : 20, lo = d.sex === 'f' ? 22 : 14;
  const mode = pbf >= hi ? 'cut' : pbf <= lo ? 'bulk' : 'recomp';
  let dW, dS, dB;
  if (mode === 'cut') { dW = -r1(d.weight * 0.014); dB = r1(dW * 0.8); dS = 0; }           // 0.7%/wk
  else if (mode === 'bulk') { dW = r1(d.weight * 0.005); dS = 0.3; dB = r1(dW * 0.3); }    // 0.25%/wk
  else { dS = 0.2; dB = -0.6; dW = r1(dB + dS * 1.5); }
  return { weight: r1(d.weight + dW), smm: r1(d.smm + dS), bfm: r1(d.bfm + dB) };
}
function modeOf(d, g) {
  const dB = g.bfm - d.bfm, dS = g.smm - d.smm, dW = g.weight - d.weight;
  if (dB < -0.2 && dS > 0.05) return 'recomp';
  if (dW > 0.1) return 'bulk';
  if (dB < 0 || dW < 0) return 'cut';
  return 'recomp';
}
function questsFor(d, g) {
  const b = basics(d), mode = modeOf(d, g);
  const dB = g.bfm - d.bfm, dW = g.weight - d.weight;
  let kcal, protein;
  if (mode === 'bulk') {
    kcal = b.tdee + clamp(Math.round(dW * 7700 / 14), 150, 500);
    protein = 1.6 * d.weight;
  } else {
    const cap = mode === 'recomp' ? 350 : 1000;
    kcal = Math.max(b.bmr, b.tdee - clamp(Math.round(-dB * 7700 / 14), 0, cap));
    protein = mode === 'cut' ? Math.min(2.0 * d.weight, 2.6 * b.ffm) : Math.min(1.8 * d.weight, 2.4 * b.ffm);
  }
  return {
    kcal: round50(kcal), kcalRule: mode === 'bulk' ? 'min' : 'max', protein: round5(protein),
    sleep: 7, steps: mode === 'cut' ? 9000 : mode === 'recomp' ? 8000 : 7000,
    gymPerWeek: d.activity <= 1.375 ? 3 : 4,
  };
}
function warningsFor(d, g, q) {
  const w = [], b = basics(d);
  const dW = g.weight - d.weight, dS = g.smm - d.smm, dB = g.bfm - d.bfm;
  if (Math.abs(dW) / d.weight > 0.02) w.push(`2주에 체중 ${Math.abs(dW / d.weight * 100).toFixed(1)}% 변화는 빠른 편이에요. 주당 0.5–1%가 근육을 지키는 속도예요.`);
  if (dS > 0.5) w.push('2주에 골격근 +0.5 kg 이상은 인바디 측정 오차를 넘어서기 어려워요. +0.2–0.3 kg이 현실적이에요.');
  if (dS < -0.3) w.push('골격근량을 줄이는 목표예요. 의도한 게 아니라면 골격근량은 유지로 두세요.');
  if (-dB > d.weight * 0.015) w.push('2주에 이 정도 체지방을 빼려면 하루 1,000 kcal 넘게 덜 먹어야 해서 지속하기 어려워요.');
  if (q && q.kcalRule === 'max' && q.kcal <= b.bmr) w.push(`칼로리 목표가 기초대사량(${fmt(b.bmr)} kcal) 아래로 내려가지 않게 막아뒀어요. 그만큼 지방 목표는 느리게 갈 수 있어요.`);
  return w;
}
function whyFor(d, g, q) {
  const b = basics(d), mode = modeOf(d, g);
  const sexL = d.sex === 'f' ? '여성' : '남성';
  const lvl = mode === 'cut' ? '높은 편이라 체지방 감량을' : mode === 'bulk' ? '낮은 편이라 근육 증량을' : '표준 범위라 지방은 조금 빼고 근육은 조금 붙이는 리컴포지션을';
  const dW = g.weight - d.weight, dB = g.bfm - d.bfm;
  const lines = [`체지방률 ${b.pbf.toFixed(1)}%는 ${sexL} 기준 ${lvl} 먼저 잡았어요.`];
  if (mode === 'cut') lines.push(`근손실을 줄이려고 주당 체중의 약 0.7%씩, 2주에 ${sgn(dW)} kg으로 잡았어요 ${sup(1)}`);
  if (mode === 'bulk') lines.push(`지방이 덜 붙도록 주당 체중의 0.25%씩만 늘려요. 2주에 ${sgn(dW)} kg ${sup(5)}`);
  if (mode === 'recomp') lines.push(`체중은 거의 그대로 두고 체지방 ${sgn(dB)} kg, 골격근 ${sgn(g.smm - d.smm)} kg을 노려요.`);
  lines.push(`유지 칼로리는 기초대사량 ${fmt(b.bmr)} × 활동계수 ${d.activity} ≈ ${fmt(b.tdee)} kcal예요. 지방 1 kg을 약 7,700 kcal로 계산해서 하루 ${fmt(q.kcal)} kcal ${q.kcalRule === 'min' ? '이상' : '이하'}로 정했어요 ${sup(10)}`);
  lines.push(`단백질은 하루 ${q.protein} g (체중 kg당 ${(q.protein / d.weight).toFixed(1)} g)이에요 ${mode === 'bulk' ? sup(3, 4) : sup(2, 4)}`);
  lines.push(`근육군마다 주 2회 이상 자극하도록 헬스장은 주 ${q.gymPerWeek}회, 걸음은 하루 ${fmt(q.steps)}보예요 ${sup(6, 7, 9)}`);
  lines.push(`수면은 회복을 위해 ${q.sleep}시간 이상 ${sup(8)}`);
  return lines;
}

/* ---------- progress ---------- */
function dayIdx(p) { return p?.challenge ? diffDays(p.challenge.start, today()) + 1 : 0; }
function weekGym(p, w) {
  let n = 0;
  for (let i = w * 7; i < w * 7 + 7; i++) if (p.log?.[addDays(p.challenge.start, i)]?.gym) n++;
  return n;
}
function progress(p) {
  if (!p?.challenge || !p.quests) return { done: 0, total: 1, pct: 0 };
  const g = p.quests.gymPerWeek, total = DAILY.length * 14 + g * 2;
  let done = 0;
  for (let i = 0; i < 14; i++) {
    const l = p.log?.[addDays(p.challenge.start, i)];
    if (l) DAILY.forEach(k => { if (l[k]) done++; });
  }
  done += Math.min(weekGym(p, 0), g) + Math.min(weekGym(p, 1), g);
  return { done, total, pct: Math.min(1, done / total) };
}
function dayCount(p, date) { const l = p.log?.[date]; return l ? ['kcal', 'protein', 'sleep', 'steps', 'gym'].filter(k => l[k]).length : 0; }
function results(p) {
  return ['weight', 'smm', 'bfm'].map(k => {
    const want = p.goal[k] - p.start[k], got = p.final[k] - p.start[k];
    const ok = Math.abs(want) < 0.15 ? Math.abs(got) <= 0.3 : want < 0 ? got <= want + 0.1 : got >= want - 0.1;
    return { k, want, got, ok };
  });
}

/* ---------- badges & levels ---------- */
const BADGES = [
  { id: 'first', glyph: '출발', name: '첫 발', desc: '퀘스트를 처음 해냈어요', goals: [1], unit: '' },
  { id: 'perfect', glyph: '올킬', name: '올킬 데이', desc: '하루 퀘스트 5개를 전부 해낸 날', goals: [1, 3, 7], unit: '일' },
  { id: 'streak', glyph: '연속', name: '연속 출석', desc: '4개 이상 해낸 날이 이어진 최장 기록', goals: [3, 5, 7], unit: '일 연속' },
  { id: 'gym', glyph: '쇠질', name: '쇠질 장인', desc: '헬스장에 간 날', goals: [3, 6, 9], unit: '회' },
  { id: 'protein', glyph: '단백', name: '단백질 괴물', desc: '단백질 퀘스트를 해낸 날', goals: [5, 10, 14], unit: '일' },
  { id: 'kcal', glyph: '식단', name: '식단 사수', desc: '칼로리 퀘스트를 해낸 날', goals: [5, 10, 14], unit: '일' },
  { id: 'sleep', glyph: '숙면', name: '잠든 사자', desc: '수면 퀘스트를 해낸 날', goals: [5, 10, 14], unit: '일' },
  { id: 'steps', glyph: '만보', name: '걷는 남자', desc: '걸음 퀘스트를 해낸 날', goals: [5, 10, 14], unit: '일' },
  { id: 'weekend', glyph: '주말', name: '주말 전사', desc: '토요일과 일요일 이틀 다 헬스장', goals: [1, 2], unit: '번' },
  { id: 'half', glyph: '반환', name: '반환점', desc: '진행률 50%를 넘었어요', goals: [1], unit: '' },
  { id: 'finish', glyph: '완주', name: '완주', desc: '결승선에 도착했어요', goals: [1], unit: '' },
  { id: 'goal', glyph: '달성', name: '몸이 증명', desc: '2주 뒤 인바디에서 목표를 이룬 항목', goals: [1, 2, 3], unit: '개' },
  { id: 'season', glyph: '시즌', name: '시즌 베테랑', desc: '2주 챌린지를 완주한 횟수', goals: [1, 2, 4], unit: '번' },
];
const TIER_CLS = ['bronze', 'silver', 'gold'], TIER_KO = { bronze: '브론즈', silver: '실버', gold: '골드', special: '스페셜' };
const LEVELS = [[0, '헬린이'], [100, '쇠질 입문'], [250, '득근러'], [450, '3대 300'], [700, '3대 400'], [1000, '3대 500'], [1400, '헬스 고인물'], [1900, '근육의 신']];

function stats(p) {
  const s = { first: 0, perfect: 0, streak: 0, gym: 0, protein: 0, kcal: 0, sleep: 0, steps: 0, weekend: 0, half: 0, finish: 0, goal: 0,
    season: (p?.history || []).filter(h => h.pct >= 100).length };
  if (p?.challenge) {
    let run = 0;
    for (let i = 0; i < 14; i++) {
      const k = addDays(p.challenge.start, i), l = p.log?.[k] || {}, c = dayCount(p, k);
      if (c) s.first = 1;
      if (c === 5) s.perfect++;
      run = c >= 4 ? run + 1 : 0; s.streak = Math.max(s.streak, run);
      ['gym', 'protein', 'kcal', 'sleep', 'steps'].forEach(q => { if (l[q]) s[q]++; });

function saveMe(mut, okMsg) {

  const cur = JSON.parse(JSON.stringify(me() || {}));

  if (S.demo) { if (okMsg) toast(okMsg + ' (예시 화면이라 저장되지는 않아요)'); return Promise.resolve(true); }
  S.pending++;

    const { error } = await S.sb.from('players').upsert({ id: S.myId, data: cur, updated_at: new Date().toISOString() });

const EXAMPLE = { sex: 'm', height: 175, weight: 78.4, smm: 33.1, bfm: 18.6, activity: 1.55 };
function ibChart(d, g, example) {
  const h = d.height / 100, stdW = 22 * h * h, stdP = d.sex === 'f' ? 0.23 : 0.15;
  const stdB = stdW * stdP, stdS = (stdW - stdB) * (d.sex === 'f' ? 0.53 : 0.57);

    ['골격근량', 'SMM', d.smm, g?.smm, stdS, [70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170], [90, 110]],
    ['체지방량', 'Body Fat Mass', d.bfm, g?.bfm, stdB, [40, 60, 80, 100, 160, 220, 280, 340, 400, 460, 520], [80, 160]],
  ];
  const pos = (v, t) => {
    if (v <= t[0]) return 0;
    for (let i = 0; i < t.length - 1; i++) if (v <= t[i + 1]) return (i + (v - t[i]) / (t[i + 1] - t[i])) / (t.length - 1) * 100;

    }).join('')}

function saveSetup(keep) {
  readDraft();
  const d = S.draft;
  if (!validIb(d) || !d.goal || !d.quests) { toast('인바디 숫자와 목표를 확인해 주세요.'); return; }
  const prev = me();
  const startIb = { date: keep ? prev.start.date : today(), weight: d.weight, smm: d.smm, bfm: d.bfm, pbf: r1(d.bfm / d.weight * 100), bmrInput: d.bmr || null };
  saveMe(c => {
    if (!keep && prev?.challenge) {
      const s = stats(prev); delete s.season;
      c.kept = s; c.xpBank = xpTotal(prev);
      c.history = (c.history || []).concat([{ start: prev.challenge.start, pct: r1(progress(prev).pct * 100), from: prev.start, goal: prev.goal, final: prev.final || null }]).slice(-12);
    }
    Object.assign(c, {
      nickname: d.nickname, sex: d.sex, age: d.age, height: d.height, activity: d.activity, start: startIb,
      goal: { ...d.goal, source: d.source, aiWhy: d.source === 'ai' ? d.aiWhy : '' },
      quests: { ...d.quests, touched: d.qTouched },
    });
    if (!keep) { c.challenge = { start: today(), days: 14 }; c.log = {}; c.final = null; }
  }, keep ? '목표를 고쳤어요. 지금까지 기록은 그대로예요.' : '출발! 오늘 퀘스트부터 체크해 보세요.').then(ok => {
    if (ok === false) return;
    S.draft = null; S.draftDirty = false; S.selDay = null;
    location.hash = '#quest';
  });
}

  S.players = {

/* ---------- boot ---------- */
function refreshViews() {
  if (S.needAuth) return;
  if (S.view === 'setup' && !S.draftDirty) { S.draft = null; renderSetup(); }
  else renderLive();
  if (S.loaded && !me() && !location.hash) location.hash = '#setup';
}
async function loadPlayers() {
  if (!S.myId) return;
  const { data, error } = await S.sb.from('players').select('id,data');
  if (error) { console.error(error); S.stale = true; notice(); return; }
  if (S.pending > 0) return; // a newer local write is still on its way
  S.players = Object.fromEntries(data.map(r => [r.id, r.data]));
  S.loaded = true; S.stale = false; notice();
  refreshViews();
}
let live = null, startedFor = undefined;
async function start() {
  if (startedFor === S.myId) return;
  startedFor = S.myId;
  if (live) { S.sb.removeChannel(live); live = null; }
  S.players = {}; S.loaded = false; S.draft = null; S.draftDirty = false; S.selDay = null;
  S.needAuth = !S.myId;
  route();
  if (!S.myId) return;
  await loadPlayers();
  live = S.sb.channel('players-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, pl => {
      if (pl.eventType === 'DELETE') delete S.players[pl.old.id];
      else { if (pl.new.id === S.myId && S.pending > 0) return; S.players[pl.new.id] = pl.new.data; }
      refreshViews();
    })
    .subscribe();
}

  document.querySelectorAll('#auth-mode button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#a-nick-f').hidden = authMode !== 'signup';
  $('#a-pw').autocomplete = authMode === 'signup' ? 'new-password' : 'current-password';
  $('#a-submit').textContent = authMode === 'signup' ? '가입하고 출발' : '로그인';
  $('#a-err').innerHTML = '';
});
$('#auth-form').onsubmit = async e => {
  e.preventDefault();
  const email = $('#a-email').value.trim(), password = $('#a-pw').value, nickname = $('#a-nick').value.trim().slice(0, 20);
  const err = m => { $('#a-err').innerHTML = `<p>${esc(m)}</p>`; };
  if (authMode === 'signup' && !nickname) return err('레이스에 보일 이름을 적어 주세요.');
  if (password.length < 6) return err('비밀번호는 6자 이상이어야 해요.');
  const btn = $('#a-submit'); btn.disabled = true;
  try {
    if (authMode === 'signup') {
      const { data, error } = await S.sb.auth.signUp({ email, password, options: { data: { nickname } } });
      if (error) throw error;
      if (!data.session) err('가입은 됐지만 이메일 확인이 켜져 있어요. 메일함의 확인 링크를 누른 뒤 로그인해 주세요.');
    } else {
      const { error } = await S.sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (x) {
    const m = String(x?.message || '');
    if (/already registered/i.test(m)) err('이미 가입한 이메일이에요. "로그인"을 눌러 주세요.');
    else if (/invalid login/i.test(m)) err('이메일이나 비밀번호가 맞지 않아요.');
    else if (/rate limit/i.test(m)) err('잠시 요청이 많아요. 1분 뒤 다시 시도해 주세요.');
    else err('처리하지 못했어요: ' + m);
  } finally { btn.disabled = false; }
};
$('#logout').onclick = () => S.sb.auth.signOut();

window.addEventListener('hashchange', route);
$('#cele-ok').onclick = showCele;
$('#cele').addEventListener('keydown', e => { if (e.key === 'Escape') { celeQ.length = 0; showCele(); } });
(() => {
  const C = window.INBODY_CONFIG || {};
  const ready = window.supabase && C.supabaseUrl && C.supabaseAnonKey && !/YOUR_/.test(C.supabaseUrl + C.supabaseAnonKey);
  if (!ready) { loadDemo(); notice(); route(); return; }
  S.sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
  route();
  S.sb.auth.onAuthStateChange((_ev, session) => {
    S.session = session; S.myId = session?.user?.id || null;
    setTimeout(start, 0); // keep Supabase calls out of the auth callback
  });
  // realtime is the main channel; this catches anything missed while the tab slept
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadPlayers(); });
  setInterval(() => { if (!document.hidden) loadPlayers(); }, 60000);
})();
</script>
